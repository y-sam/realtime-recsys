name: rtrec

services:
  redpanda:
    image: redpandadata/redpanda:v24.3.1
    container_name: rtrec-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"   # host-only; reach it over an SSH tunnel, never public
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  console:
    image: redpandadata/console:v2.7.2
    container_name: rtrec-console
    depends_on: [redpanda]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"   # host-only; reach it over an SSH tunnel, never public
    profiles: ["dev"]

  redis:
    image: redis:7.4-alpine
    container_name: rtrec-redis
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"   # compose-internal only -- no service outside this stack needs it
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: rtrec-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtrec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rtrec}
      POSTGRES_DB: ${POSTGRES_DB:-rtrec}
    expose:
      - "5432"   # compose-internal only -- no service outside this stack needs it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtrec}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

  simulator:
    build: ./services/simulator
    container_name: rtrec-simulator
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      EVENTS_TOPIC: user_events
      EVENTS_PER_SECOND: ${EVENTS_PER_SECOND:-8}
      N_USERS: ${N_USERS:-5000}
      N_ITEMS: ${N_ITEMS:-2000}
      SEED: 42
    restart: unless-stopped

  consumer:
    build: ./services/consumer
    container_name: rtrec-consumer
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      EVENTS_TOPIC: user_events
      CONSUMER_GROUP: online-features
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  sink:
    build: ./services/sink
    container_name: rtrec-sink
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      EVENTS_TOPIC: user_events
      CONSUMER_GROUP: postgres-sink
      PG_DSN: postgresql://${POSTGRES_USER:-rtrec}:${POSTGRES_PASSWORD:-rtrec}@postgres:5432/${POSTGRES_DB:-rtrec}
      SINK_BATCH_SIZE: ${SINK_BATCH_SIZE:-500}
      SINK_RETENTION_DAYS: ${SINK_RETENTION_DAYS:-30}
    restart: unless-stopped

  api:
    build: ./services/api
    container_name: rtrec-api
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /models
      KAFKA_BOOTSTRAP: redpanda:9092
      EVENTS_TOPIC: user_events
      CONSUMER_GROUP: online-features
      PG_DSN: postgresql://${POSTGRES_USER:-rtrec}:${POSTGRES_PASSWORD:-rtrec}@postgres:5432/${POSTGRES_DB:-rtrec}
      N_ITEMS: ${N_ITEMS:-2000}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    ports:
      - "127.0.0.1:8000:8000"   # public access goes through the host nginx reverse proxy,
                                 # not this port -- see DEPLOY.md
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: rtrec-prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"   # host-only; reach it over an SSH tunnel, never public
    depends_on:
      - api
    restart: unless-stopped
    profiles: ["dev"]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: rtrec-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"   # host-only; reach it over an SSH tunnel, never public
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles: ["dev"]

  dashboard:
    build: ./services/dashboard
    container_name: rtrec-dashboard
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      API_URL: http://api:8000
      PG_DSN: postgresql://${POSTGRES_USER:-rtrec}:${POSTGRES_PASSWORD:-rtrec}@postgres:5432/${POSTGRES_DB:-rtrec}
      REDIS_URL: redis://redis:6379/0
      N_ITEMS: ${N_ITEMS:-2000}
      N_USERS: ${N_USERS:-5000}
      GRAFANA_URL: http://localhost:3000/d/recsys-observability
    volumes:
      - ./models:/models:ro
    ports:
      - "127.0.0.1:8501:8501"   # host-only; reach it over an SSH tunnel, never public
    restart: unless-stopped
    profiles: ["dev"]

volumes:
  redpanda-data:
  pg-data:
